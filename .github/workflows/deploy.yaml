name: CloudMart Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: dev
  AWS_REGION: ap-south-1

jobs:

  # ============================================================
  # CLOUDFORMATION YAML LINTING
  # ============================================================

  lint-yaml:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Lint CloudFormation YAML files
        run: |
          find cloudformation \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 | xargs -0 yamllint -d relaxed


  # ============================================================
  # NETWORK STACK
  # ============================================================

  deploy-network:
    runs-on: ubuntu-latest

    needs: lint-yaml

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-network \
            --parameter-overrides Environment=${ENVIRONMENT} \
            --region ${AWS_REGION} \
            --no-fail-on-empty-changeset

      - name: Check Network Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-network \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Network Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-network \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # DATA STACK
  # ============================================================

  deploy-data:
    runs-on: ubuntu-latest

    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-data-newversion \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              MasterUsername="${{ secrets.DB_USERNAME }}" \
              MasterUserPassword="${{ secrets.DB_PASSWORD }}" \
            --no-fail-on-empty-changeset

      - name: Check Data Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-data-newversion \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Data Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-data-newversion \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # IAM STACK
  # ============================================================

  deploy-iam:
    runs-on: ubuntu-latest

    needs: deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-iam \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Check IAM Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-iam \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show IAM Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-iam \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show IAM Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-iam \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # AUTHENTICATION STACK
  # ============================================================

  deploy-auth:
    runs-on: ubuntu-latest

    needs: deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Package Authorizer Lambda
        run: |
          mkdir -p build/authorizer
          cp lambda/lambda-authorizer/index.py build/authorizer/index.py
          cd build/authorizer
          zip -r ../../lambda-authorizer.zip .

      - name: Upload Authorizer Lambda to S3
        run: |
          aws s3 cp \
            lambda-authorizer.zip \
            s3://cloudmart-${ENVIRONMENT}-reports-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}/lambda/lambda-authorizer-${GITHUB_SHA}.zip

      - name: Validate Auth CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-auth \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              AuthToken="${{ secrets.CLOUDMART_AUTH_TOKEN }}" \
              AdminToken="${{ secrets.CLOUDMART_ADMIN_TOKEN }}" \
              AuthorizerLambdaS3Key=lambda/lambda-authorizer-${GITHUB_SHA}.zip \
            --no-fail-on-empty-changeset

      - name: Check Auth Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-auth \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Auth Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-auth \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show Auth Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-auth \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # API STACK
  # ============================================================

  deploy-api:
    runs-on: ubuntu-latest

    needs: deploy-auth

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Package Product Lambda
        run: |
          rm -rf build/product-lambda
          mkdir -p build/product-lambda
          cp lambda/product-lambda/index.py build/product-lambda/index.py

          if [ -f lambda/product-lambda/requirements.txt ]; then
            python -m pip install \
              -r lambda/product-lambda/requirements.txt \
              -t build/product-lambda
          fi

          cd build/product-lambda
          zip -r ../../product-lambda.zip .

      - name: Package Order Processor Lambda
        run: |
          rm -rf build/order-processor
          mkdir -p build/order-processor

          cp lambda/order-processor/index.py build/order-processor/index.py

          python -m pip install \
            -r lambda/order-processor/requirements.txt \
            -t build/order-processor

          cd build/order-processor
          zip -r ../../order-processor.zip .

      - name: Upload Lambda ZIPs to S3
        run: |
          aws s3 cp \
            product-lambda.zip \
            s3://cloudmart-${ENVIRONMENT}-reports-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}/lambda/product-lambda-${GITHUB_SHA}.zip

          aws s3 cp \
            order-processor.zip \
            s3://cloudmart-${ENVIRONMENT}-reports-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}/lambda/order-processor-${GITHUB_SHA}.zip

      - name: Validate API CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-api \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              ProductLambdaS3Key=lambda/product-lambda-${GITHUB_SHA}.zip \
              OrderProcessorLambdaS3Key=lambda/order-processor-${GITHUB_SHA}.zip \
            --no-fail-on-empty-changeset

      - name: Check API Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-api \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show API Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-api \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show API Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-api \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # TEMPORARY RDS CONNECTIVITY TEST
  # ============================================================

  deploy-rds-test:
    runs-on: ubuntu-latest

    needs: deploy-auth

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate RDS Test CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/rds-test-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy RDS Test Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/rds-test-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-rds-test \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show RDS Test Lambda
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-rds-test \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # TEST PRODUCT LAMBDA
  # ============================================================

  test-product-lambda:
    runs-on: ubuntu-latest

    needs: deploy-api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Invoke Product Lambda
        run: |
          aws lambda invoke \
            --function-name CloudMart-${ENVIRONMENT}-ProductService \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json

      - name: Show Lambda response
        run: |
          cat response.json


  # ============================================================
  # MONITORING STACK
  # ============================================================

  deploy-monitoring:
    name: Deploy Monitoring Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-api

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy Monitoring Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/monitoring-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-monitoring \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              AlertEmail="${{ secrets.ALERT_EMAIL }}" \
            --capabilities CAPABILITY_NAMED_IAM


  # ============================================================
  # REPORT STACK
  # ============================================================

  deploy-report:
    runs-on: ubuntu-latest

    needs: deploy-api

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Package Report Lambda
        run: |
          rm -rf build/report-lambda
          mkdir -p build/report-lambda

          cp lambda/report-lambda/index.py \
            build/report-lambda/index.py

          python -m pip install \
            -r lambda/report-lambda/requirements.txt \
            -t build/report-lambda

          cd build/report-lambda
          zip -r ../../report-lambda.zip .

      - name: Upload Report Lambda to S3
        run: |
          aws s3 cp \
            report-lambda.zip \
            s3://cloudmart-${ENVIRONMENT}-reports-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}/lambda/report-lambda-${GITHUB_SHA}.zip

      - name: Validate Report CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/report-stack.yaml \
            --region ${AWS_REGION}

      - name: Deploy Report Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/report-stack.yaml \
            --stack-name cloudmart-${ENVIRONMENT}-report \
            --region ${AWS_REGION} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              ReportLambdaS3Key=lambda/report-lambda-${GITHUB_SHA}.zip \
            --no-fail-on-empty-changeset

      - name: Check Report Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-report \
            --region ${AWS_REGION} \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Report Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-${ENVIRONMENT}-report \
            --region ${AWS_REGION} \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show Report Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-${ENVIRONMENT}-report \
            --region ${AWS_REGION} \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # EC2 DASHBOARD
  # ============================================================

    # ============================================================
  # EC2 DASHBOARD
  # ============================================================

  deploy-dashboard:
    name: Deploy EC2 Dashboard

    needs:
      - deploy-api

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS access
        run: |
          aws sts get-caller-identity
          echo "AWS Region: ${AWS_REGION}"


      - name: Get Reports Bucket
        shell: bash
        run: |

          REPORTS_BUCKET=$(
            aws ssm get-parameter \
              --name "/cloudmart/${ENVIRONMENT}/storage/reports-bucket" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}"
          )

          echo "REPORTS_BUCKET=${REPORTS_BUCKET}" >> "${GITHUB_ENV}"

          echo "Reports bucket: ${REPORTS_BUCKET}"


      - name: Verify Dashboard Files
        run: |

          test -f dashboard/app.py

          test -f dashboard/requirements.txt

          test -f dashboard/templates/index.html

          echo "Dashboard files verified."


      - name: Upload Dashboard Files
        run: |

          aws s3 cp \
            dashboard/ \
            "s3://${REPORTS_BUCKET}/dashboard/" \
            --recursive \
            --region "${AWS_REGION}"


      - name: Verify Dashboard Upload
        run: |

          aws s3 ls \
            "s3://${REPORTS_BUCKET}/dashboard/" \
            --recursive \
            --region "${AWS_REGION}"


      - name: Validate Dashboard Stack
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/dashboard-stack.yaml \
            --region "${AWS_REGION}"


      - name: Deploy Dashboard Stack
        run: |

          aws cloudformation deploy \
            --stack-name "cloudmart-${ENVIRONMENT}-dashboard" \
            --template-file cloudformation/dashboard-stack.yaml \
            --region "${AWS_REGION}" \
            --parameter-overrides \
              Environment="${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      - name: Dashboard Stack Status
        run: |

          aws cloudformation describe-stacks \
            --stack-name "cloudmart-${ENVIRONMENT}-dashboard" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].StackStatus" \
            --output text


      - name: Get Dashboard EC2 Instance ID
        id: dashboard-instance
        shell: bash
        run: |

          INSTANCE_ID=$(
            aws cloudformation describe-stacks \
              --stack-name "cloudmart-${ENVIRONMENT}-dashboard" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue" \
              --output text
          )

          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "Dashboard EC2 instance ID was not found."
            exit 1
          fi

          echo "Dashboard EC2 instance: ${INSTANCE_ID}"
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "${GITHUB_ENV}"


      - name: Wait for EC2 to become available in SSM
        shell: bash
        run: |

          echo "Waiting for ${INSTANCE_ID} to become an SSM managed instance..."

          for attempt in $(seq 1 60); do

            STATUS=$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || true
            )

            echo "SSM status: ${STATUS:-NotRegistered} (attempt ${attempt}/60)"

            if [ "${STATUS}" = "Online" ]; then
              break
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "EC2 did not become Online in SSM within the expected time."
              exit 1
            fi

            sleep 10

          done


      - name: Update dashboard on EC2 through SSM
        shell: bash
        run: |

          cat > /tmp/cloudmart-dashboard-ssm.json <<EOF
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["${INSTANCE_ID}"],
            "Comment": "CloudMart dashboard deployment ${GITHUB_SHA}",
            "Parameters": {
              "commands": [
                "set -e",
                "for attempt in \$(seq 1 60); do test -f /opt/cloudmart-dashboard/.userdata-complete && break; if [ \"\${attempt}\" -eq 60 ]; then echo 'EC2 UserData did not finish'; exit 1; fi; sleep 5; done",
                "mkdir -p /opt/cloudmart-dashboard/templates",
                "aws s3 cp s3://${REPORTS_BUCKET}/dashboard/app.py /opt/cloudmart-dashboard/app.py --region ${AWS_REGION}",
                "aws s3 cp s3://${REPORTS_BUCKET}/dashboard/requirements.txt /opt/cloudmart-dashboard/requirements.txt --region ${AWS_REGION}",
                "aws s3 cp s3://${REPORTS_BUCKET}/dashboard/templates/index.html /opt/cloudmart-dashboard/templates/index.html --region ${AWS_REGION}",
                "test -f /opt/cloudmart-dashboard/app.py",
                "test -f /opt/cloudmart-dashboard/requirements.txt",
                "test -f /opt/cloudmart-dashboard/templates/index.html",
                "python3 -m pip install -r /opt/cloudmart-dashboard/requirements.txt",
                "command -v gunicorn",
                "systemctl daemon-reload",
                "systemctl enable cloudmart-dashboard",
                "systemctl restart cloudmart-dashboard",
                "sleep 5",
                "systemctl is-active --quiet cloudmart-dashboard",
                "curl --fail --silent --show-error http://127.0.0.1:5000/health",
                "echo CloudMart dashboard update completed successfully"
              ]
            }
          }
          EOF

          COMMAND_ID=$(
            aws ssm send-command \
              --cli-input-json file:///tmp/cloudmart-dashboard-ssm.json \
              --region "${AWS_REGION}" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM command: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do

            STATUS=$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --region "${AWS_REGION}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )

            echo "SSM command status: ${STATUS:-Pending} (attempt ${attempt}/60)"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query "StandardOutputContent" \
                  --output text
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM dashboard deployment failed."
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query "[Status,StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for SSM dashboard deployment."
              exit 1
            fi

            sleep 10

          done


      - name: Dashboard Stack Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name "cloudmart-${ENVIRONMENT}-dashboard" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs"

