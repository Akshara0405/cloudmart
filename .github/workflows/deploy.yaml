
name: CloudMart Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # YAML LINTING
  # Checks all YAML files before deployment
  # ============================================================

  lint-yaml:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Lint all YAML files
        run: |
          find . \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -not -path "./.git/*" \
            -print0 | xargs -0 yamllint -d relaxed


  # ============================================================
  # NETWORK STACK
  # Runs only after YAML linting succeeds
  # ============================================================

  deploy-network:
    runs-on: ubuntu-latest

    needs: lint-yaml

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-dev-network \
            --parameter-overrides Environment=dev \
            --region ap-south-1 \
            --no-fail-on-empty-changeset

      - name: Wait for Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name cloudmart-dev-network \
              --region ap-south-1
          elif [[ "$STATUS" == "UPDATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-update-complete \
              --stack-name cloudmart-dev-network \
              --region ap-south-1
          fi

      - name: Check Network Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Network Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-network \
            --region ap-south-1 \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # DATA STACK
  # Runs only after Network Stack succeeds
  # ============================================================

  deploy-data:
    runs-on: ubuntu-latest

    needs: deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Verify Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-network \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network stack status: $STATUS"

          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "Network stack is not ready."
            exit 1
          fi

      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-dev-data \
            --region ap-south-1 \
            --parameter-overrides \
              Environment=dev \
              MasterUsername="${{ secrets.DB_USERNAME }}" \
              MasterUserPassword="${{ secrets.DB_PASSWORD }}" \
            --no-fail-on-empty-changeset

      - name: Wait for Data Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name cloudmart-dev-data \
              --region ap-south-1
          elif [[ "$STATUS" == "UPDATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-update-complete \
              --stack-name cloudmart-dev-data \
              --region ap-south-1
          fi

      - name: Check Data Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Data Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-data \
            --region ap-south-1 \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


  # ============================================================
  # IAM STACK
  # Runs only after Data Stack succeeds
  # ============================================================

  deploy-iam:
    runs-on: ubuntu-latest

    needs: deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-data \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data stack status: $STATUS"

          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "Data stack is not ready."
            exit 1
          fi

      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Wait for IAM Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name cloudmart-dev-iam \
              --region ap-south-1
          elif [[ "$STATUS" == "UPDATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-update-complete \
              --stack-name cloudmart-dev-iam \
              --region ap-south-1
          fi

      - name: Check IAM Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show IAM Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show IAM Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "Stacks[0].Outputs" \
            --output table


  # ============================================================
  # AUTHENTICATION STACK
  # Runs only after IAM Stack succeeds
  # ============================================================

  deploy-auth:
    runs-on: ubuntu-latest

    needs: deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Verify IAM Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM stack status: $STATUS"

          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "IAM stack is not ready."
            exit 1
          fi

      - name: Validate Auth CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack.yaml

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack.yaml \
            --stack-name cloudmart-dev-auth \
            --region ap-south-1 \
            --parameter-overrides \
              Environment=dev \
              AuthToken="${{ secrets.CLOUDMART_AUTH_TOKEN }}" \
            --no-fail-on-empty-changeset

      - name: Wait for Auth Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [[ "$STATUS" == "CREATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-create-complete \
              --stack-name cloudmart-dev-auth \
              --region ap-south-1
          elif [[ "$STATUS" == "UPDATE_IN_PROGRESS" ]]; then
            aws cloudformation wait stack-update-complete \
              --stack-name cloudmart-dev-auth \
              --region ap-south-1
          fi

      - name: Check Auth Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region ap-south-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Auth Stack Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-auth \
            --region ap-south-1 \
            --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table

      - name: Show Auth Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-auth \
            --region ap-south-1 \
            --query "Stacks[0].Outputs" \
            --output table

