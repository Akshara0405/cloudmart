name: CloudMart IAM Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  deploy-iam:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Check IAM Stack Status
        if: always()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1

      - name: Show IAM Stack Events
        if: always()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1

      - name: Show IAM Stack Outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-dev-iam \
            --region ap-south-1 \
            --query "Stacks[0].Outputs" \
            --output table