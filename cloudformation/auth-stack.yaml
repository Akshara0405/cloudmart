AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16

  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16

  AuthorizerLambdaS3Key:
    Type: String


Resources:

  # ============================================================
  # CUSTOMER TOKEN SSM PARAMETER
  # ============================================================

  CustomerTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub /cloudmart/${Environment}/auth/customer-token

      Type: String

      Value: !Ref AuthToken

      Description: CloudMart customer authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: CUSTOMER


  # ============================================================
  # ADMIN TOKEN SSM PARAMETER
  # ============================================================

  AdminTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub /cloudmart/${Environment}/auth/admin-token

      Type: String

      Value: !Ref AdminToken

      Description: CloudMart admin authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: ADMIN


  # ============================================================
  # AUTHORIZER LAMBDA
  # ============================================================

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout: 10

      MemorySize: 128

      # --------------------------------------------------------
      # VPC
      # --------------------------------------------------------

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub CloudMart-${Environment}-PrivateSubnet2Id

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          # ----------------------------------------------------
          # AUTH PARAMETERS
          # ----------------------------------------------------

          CUSTOMER_TOKEN_PARAMETER: !Sub /cloudmart/${Environment}/auth/customer-token

          ADMIN_TOKEN_PARAMETER: !Sub /cloudmart/${Environment}/auth/admin-token

          # ----------------------------------------------------
          # DATABASE PARAMETERS
          # ----------------------------------------------------

          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/database/host

          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/database/port

          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/database/name

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/database/username

          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/database/password

      # --------------------------------------------------------
      # LAMBDA CODE
      # --------------------------------------------------------

      Code:

        S3Bucket: cloudmart-dev-reports-062585739401-ap-south-1

        S3Key: !Ref AuthorizerLambdaS3Key

      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # API GATEWAY → AUTHORIZE LAMBDA PERMISSION
  # ============================================================

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref AuthorizerLambda

      Action: lambda:InvokeFunction

      Principal: apigateway.amazonaws.com


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  # ============================================================
  # AUTHORIZER FUNCTION ARN
  # ============================================================

  AuthorizerFunctionArn:

    Description: CloudMart Lambda Authorizer ARN

    Value: !GetAtt AuthorizerLambda.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionArn


  # ============================================================
  # AUTHORIZER INVOKE ARN
  # ============================================================

  AuthorizerFunctionInvokeArn:

    Description: CloudMart Lambda Authorizer invoke ARN

    Value: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambda.Arn}/invocations

    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn


  # ============================================================
  # CUSTOMER TOKEN PARAMETER NAME
  # ============================================================

  CustomerTokenParameterName:

    Description: SSM customer authentication token parameter

    Value: !Ref CustomerTokenParameter

    Export:
      Name: !Sub CloudMart-${Environment}-CustomerTokenParameterName


  # ============================================================
  # CUSTOMER TOKEN PARAMETER ARN
  # ============================================================

  CustomerTokenParameterArn:

    Description: SSM customer authentication token parameter ARN

    Value: !GetAtt CustomerTokenParameter.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-CustomerTokenParameterArn


  # ============================================================
  # ADMIN TOKEN PARAMETER NAME
  # ============================================================

  AdminTokenParameterName:

    Description: SSM admin authentication token parameter

    Value: !Ref AdminTokenParameter

    Export:
      Name: !Sub CloudMart-${Environment}-AdminTokenParameterName


  # ============================================================
  # ADMIN TOKEN PARAMETER ARN
  # ============================================================

  AdminTokenParameterArn:

    Description: SSM admin authentication token parameter ARN

    Value: !GetAtt AdminTokenParameter.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-AdminTokenParameterArn
  