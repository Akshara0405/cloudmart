
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16

  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16

Resources:

  CustomerTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name:
        !Sub /cloudmart/${Environment}/auth/customer-token

      Type: String

      Value:
        !Ref AuthToken

      Description:
        CloudMart customer authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: CUSTOMER

  AdminTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name:
        !Sub /cloudmart/${Environment}/auth/admin-token

      Type: String

      Value:
        !Ref AdminToken

      Description:
        CloudMart admin authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: ADMIN

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout: 10

      MemorySize: 128

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Environment:

        Variables:

          CUSTOMER_TOKEN_PARAMETER:
            !Sub /cloudmart/${Environment}/auth/customer-token

          ADMIN_TOKEN_PARAMETER:
            !Sub /cloudmart/${Environment}/auth/admin-token

      Code:

        ZipFile: |

          import os
          import boto3

          ssm = boto3.client("ssm")

          CUSTOMER_TOKEN_PARAMETER = os.environ[
              "CUSTOMER_TOKEN_PARAMETER"
          ]

          ADMIN_TOKEN_PARAMETER = os.environ[
              "ADMIN_TOKEN_PARAMETER"
          ]

          def get_token(parameter_name):
              response = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]

          def generate_policy(principal_id, effect, resource):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }

          def build_method_resource(method_arn):
              return method_arn

          def build_stage_resource(method_arn):
              arn_parts = method_arn.split(":")
              api_gateway_arn = arn_parts[5]

              parts = api_gateway_arn.split("/")

              api_id = parts[0]
              stage = parts[1]

              return (
                  f"{':'.join(arn_parts[0:5])}:"
                  f"{api_id}/{stage}/*/*"
              )

          def is_customer_allowed(method, path):
              if method == "GET" and path.startswith("/products"):
                  return True

              if method == "POST" and path == "/orders":
                  return True

              if method == "GET" and path.startswith("/orders"):
                  return True

              return False

          def lambda_handler(event, context):

              authorization_header = event.get(
                  "authorizationToken",
                  ""
              )

              if not authorization_header.startswith("Bearer "):
                  raise Exception("Unauthorized")

              provided_token = authorization_header[7:].strip()

              if not provided_token:
                  raise Exception("Unauthorized")

              customer_token = get_token(
                  CUSTOMER_TOKEN_PARAMETER
              )

              admin_token = get_token(
                  ADMIN_TOKEN_PARAMETER
              )

              method_arn = event["methodArn"]

              arn_parts = method_arn.split(":")
              api_gateway_arn = arn_parts[5]
              path_parts = api_gateway_arn.split("/")

              if len(path_parts) < 4:
                  raise Exception("Unauthorized")

              method = path_parts[2]
              path = "/" + "/".join(path_parts[3:])

              if provided_token == admin_token:

                  resource = build_stage_resource(
                      method_arn
                  )

                  return generate_policy(
                      "cloudmart-admin",
                      "Allow",
                      resource
                  )

              if provided_token == customer_token:

                  if is_customer_allowed(
                      method,
                      path
                  ):
                      resource = build_method_resource(
                          method_arn
                      )

                      return generate_policy(
                          "cloudmart-customer",
                          "Allow",
                          resource
                      )

                  raise Exception("Unauthorized")

              raise Exception("Unauthorized")

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionArn

  AuthorizerFunctionInvokeArn:
    Description: CloudMart Lambda Authorizer invoke ARN
    Value:
      !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn

  CustomerTokenParameterName:
    Description: SSM customer authentication token parameter
    Value:
      !Ref CustomerTokenParameter

    Export:
      Name:
        !Sub CloudMart-${Environment}-CustomerTokenParameterName

  CustomerTokenParameterArn:
    Description: SSM customer authentication token parameter ARN
    Value:
      !GetAtt CustomerTokenParameter.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-CustomerTokenParameterArn

  AdminTokenParameterName:
    Description: SSM admin authentication token parameter
    Value:
      !Ref AdminTokenParameter

    Export:
      Name:
        !Sub CloudMart-${Environment}-AdminTokenParameterName

  AdminTokenParameterArn:
    Description: SSM admin authentication token parameter ARN
    Value:
      !GetAtt AdminTokenParameter.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AdminTokenParameterArn

