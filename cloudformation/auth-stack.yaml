AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16

Resources:

  AuthTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name:
        !Sub /cloudmart/${Environment}/auth/token

      Type: String

      Value:
        !Ref AuthToken

      Description:
        CloudMart authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout: 10

      MemorySize: 128

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Environment:

        Variables:
          AUTH_TOKEN_PARAMETER:
            !Sub /cloudmart/${Environment}/auth/token

      Code:

        ZipFile: |

          import os
          import boto3

          ssm = boto3.client("ssm")

          TOKEN_PARAMETER = os.environ["AUTH_TOKEN_PARAMETER"]

          def get_expected_token():
              response = ssm.get_parameter(
                  Name=TOKEN_PARAMETER,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]

          def generate_policy(principal_id, effect, resource):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }

          def build_wildcard_resource(method_arn):
              arn_parts = method_arn.split(":")
              api_gateway_arn = arn_parts[5]
              api_id, stage = api_gateway_arn.split("/")[0:2]
              return f"{':'.join(arn_parts[0:5])}:{api_id}/{stage}/*/*"

          def lambda_handler(event, context):

              authorization_header = event.get("authorizationToken", "")

              if not authorization_header.startswith("Bearer "):
                  raise Exception("Unauthorized")

              provided_token = authorization_header[7:].strip()

              if not provided_token:
                  raise Exception("Unauthorized")

              expected_token = get_expected_token()

              if provided_token != expected_token:
                  raise Exception("Unauthorized")

              resource = build_wildcard_resource(event["methodArn"])

              return generate_policy(
                  "cloudmart-user",
                  "Allow",
                  resource
              )

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionArn


  AuthorizerFunctionInvokeArn:
    Description: CloudMart Lambda Authorizer invoke ARN
    Value:
      !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambda.Arn}/invocations

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn


  AuthTokenParameterName:
    Description: SSM authentication token parameter
    Value:
      !Ref AuthTokenParameter

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthTokenParameterName


  AuthTokenParameterArn:
    Description: SSM authentication token parameter ARN
    Value:
      !GetAtt AuthTokenParameter.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthTokenParameterArn
