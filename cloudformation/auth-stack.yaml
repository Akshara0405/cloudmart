
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16

  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16

  AuthorizerLambdaS3Key:
    Type: String

Resources:

  CustomerTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name:
        !Sub /cloudmart/${Environment}/auth/customer-token

      Type: String

      Value:
        !Ref AuthToken

      Description:
        CloudMart customer authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: CUSTOMER

  AdminTokenParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name:
        !Sub /cloudmart/${Environment}/auth/admin-token

      Type: String

      Value:
        !Ref AdminToken

      Description:
        CloudMart admin authentication token

      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Role: ADMIN

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-AuthorizerLambdaRoleArn

      Timeout: 10

      MemorySize: 128

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Environment:

        Variables:

          CUSTOMER_TOKEN_PARAMETER:
            !Sub /cloudmart/${Environment}/auth/customer-token

          ADMIN_TOKEN_PARAMETER:
            !Sub /cloudmart/${Environment}/auth/admin-token

      Code:

        S3Bucket: cloudmart-dev-reports-062585739401-ap-south-1

        S3Key: !Ref AuthorizerLambdaS3Key

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Authorizer

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionArn

  AuthorizerFunctionInvokeArn:
    Description: CloudMart Lambda Authorizer invoke ARN
    Value:
      !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn

  CustomerTokenParameterName:
    Description: SSM customer authentication token parameter
    Value:
      !Ref CustomerTokenParameter

    Export:
      Name:
        !Sub CloudMart-${Environment}-CustomerTokenParameterName

  CustomerTokenParameterArn:
    Description: SSM customer authentication token parameter ARN
    Value:
      !GetAtt CustomerTokenParameter.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-CustomerTokenParameterArn

  AdminTokenParameterName:
    Description: SSM admin authentication token parameter
    Value:
      !Ref AdminTokenParameter

    Export:
      Name:
        !Sub CloudMart-${Environment}-AdminTokenParameterName

  AdminTokenParameterArn:
    Description: SSM admin authentication token parameter ARN
    Value:
      !GetAtt AdminTokenParameter.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AdminTokenParameterArn

