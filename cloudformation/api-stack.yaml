AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates API Gateway, Lambda Authorizer integration,
  Product Service Lambda, Order Processor Lambda,
  Product API endpoints, and Order API endpoints.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub CloudMart-${Environment}-API
      Description: !Sub CloudMart ${Environment} REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ============================================================
  # PRODUCT RESOURCES
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products

  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  # ============================================================
  # ORDER RESOURCES
  # ============================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders

  OrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  # ============================================================
  # LAMBDA AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub CloudMart-${Environment}-Authorizer
      RestApiId: !Ref CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: CloudMart-${Environment}-AuthorizerFunctionArn
      AuthorizerResultTtlInSeconds: 300

  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-ProductService
      Runtime: python3.12
      Handler: index.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-ApplicationLambdaRoleArn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DBPasswordParameter
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
      Code:
        S3Bucket: cloudmart-dev-reports-119408973254-ap-south-1
        S3Key: lambda/product-lambda.zip

  # ============================================================
  # ORDER PROCESSOR LAMBDA
  # ============================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-OrderProcessor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-OrderProcessorLambdaRoleArn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DBPasswordParameter
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
      Code:
        S3Bucket: cloudmart-dev-reports-119408973254-ap-south-1
        S3Key: lambda/order-processor.zip

  # ============================================================
  # PRODUCT LAMBDA PERMISSION
  # ============================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        !Sub
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId: !Ref CloudMartApi

  # ============================================================
  # ORDER PROCESSOR LAMBDA PERMISSION
  # ============================================================

  OrderProcessorLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderProcessorLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        !Sub
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId: !Ref CloudMartApi

  # ============================================================
  # PRODUCT API METHODS
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn

  # ============================================================
  # ORDER API METHODS
  # ============================================================

  # POST /orders
  CreateOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn

  # GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn

  # GET /orders/{id}
  GetOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn

  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeploymentV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      # Product methods
      - CreateProductMethod
      - GetProductsMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

      # Order methods
      - CreateOrderMethod
      - GetOrdersMethod
      - GetOrderMethod

    Properties:
      RestApiId: !Ref CloudMartApi

  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref ApiDeploymentV2
      StageName: !Ref Environment

# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ApiId:
    Description: CloudMart API Gateway REST API ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub CloudMart-${Environment}-ApiId

  ApiUrl:
    Description: CloudMart API Gateway URL
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  ProductLambdaArn:
    Description: CloudMart Product Service Lambda ARN
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn

  OrderProcessorLambdaArn:
    Description: CloudMart Order Processor Lambda ARN
    Value: !GetAtt OrderProcessorLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaArn

  AuthorizerId:
    Description: API Gateway Lambda Authorizer ID
    Value: !Ref CloudMartAuthorizer
    Export:
      Name: !Sub CloudMart-${Environment}-ApiAuthorizerId