AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates API Gateway, Lambda Authorizer integration,
  Product Service Lambda, and Product API endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # ============================================================
  # API GATEWAY
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name:
        !Sub CloudMart-${Environment}-API

      Description:
        !Sub CloudMart ${Environment} REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # API GATEWAY /products RESOURCE
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !GetAtt CloudMartApi.RootResourceId

      PathPart: products


  # ============================================================
  # API GATEWAY /products/{id} RESOURCE
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: "{id}"


  # ============================================================
  # LAMBDA AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-Authorizer

      RestApiId:
        !Ref CloudMartApi

      Type: TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: CloudMart-${Environment}-AuthorizerFunctionArn

      AuthorizerResultTtlInSeconds: 300


  # ============================================================
  # PRODUCT SERVICE LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-ProductService

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-ApplicationLambdaRoleArn

      Timeout: 30

      MemorySize: 128

      Environment:
        Variables:
          ENVIRONMENT:
            !Ref Environment

          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DBPasswordParameter
      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Code:
        S3Bucket: cloudmart-dev-reports-119408973254-ap-south-1
        S3Key: lambda/product-lambda.zip
  # ============================================================
  # API GATEWAY PERMISSION TO INVOKE PRODUCT LAMBDA
  # ============================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # API GATEWAY DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - CreateProductMethod
      - GetProductsMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi


  # ============================================================
  # API GATEWAY STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ApiId:
    Description: CloudMart API Gateway REST API ID

    Value:
      !Ref CloudMartApi

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiId


  ApiUrl:
    Description: CloudMart API Gateway URL

    Value:
      !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiUrl


  ProductLambdaArn:
    Description: CloudMart Product Service Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaArn


  AuthorizerId:
    Description: API Gateway Lambda Authorizer ID

    Value:
      !Ref CloudMartAuthorizer

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiAuthorizerId
