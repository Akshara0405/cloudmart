AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates API Gateway, Lambda Authorizer integration,
  Product Service Lambda, and Product API endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:

  # ============================================================
  # API GATEWAY
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name:
        !Sub CloudMart-${Environment}-API

      Description:
        !Sub CloudMart ${Environment} REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # API GATEWAY /products RESOURCE
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !GetAtt CloudMartApi.RootResourceId

      PathPart: products


  # ============================================================
  # API GATEWAY /products/{id} RESOURCE
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId:
        !Ref CloudMartApi

      ParentId:
        !Ref ProductsResource

      PathPart: "{id}"


  # ============================================================
  # LAMBDA AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub CloudMart-${Environment}-Authorizer

      RestApiId:
        !Ref CloudMartApi

      Type: TOKEN

      IdentitySource:
        method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: CloudMart-${Environment}-AuthorizerFunctionArn

      AuthorizerResultTtlInSeconds: 300


  # ============================================================
  # PRODUCT SERVICE LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-ProductService

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-ApplicationLambdaRoleArn

      Timeout: 30

      MemorySize: 128

      Environment:
        Variables:
          ENVIRONMENT:
            !Ref Environment

          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DatabasePassword

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Code:

        ZipFile: |

          import json
          import logging
          import os

          import boto3
          import pymysql


          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          ssm = boto3.client("ssm")

          ENVIRONMENT = os.environ.get("ENVIRONMENT", "dev")

          DB_HOST_PARAMETER = f"/cloudmart/{ENVIRONMENT}/database/host"
          DB_PORT_PARAMETER = f"/cloudmart/{ENVIRONMENT}/database/port"
          DB_NAME_PARAMETER = f"/cloudmart/{ENVIRONMENT}/database/name"
          DB_USERNAME_PARAMETER = f"/cloudmart/{ENVIRONMENT}/database/username"


          def get_parameter(name):

              response = ssm.get_parameter(
                  Name=name,
                  WithDecryption=True
              )

              return response["Parameter"]["Value"]


          def get_db_connection():

              host = get_parameter(DB_HOST_PARAMETER)
              port = int(get_parameter(DB_PORT_PARAMETER))
              database = get_parameter(DB_NAME_PARAMETER)
              username = get_parameter(DB_USERNAME_PARAMETER)

              password = os.environ["DB_PASSWORD"]

              return pymysql.connect(
                  host=host,
                  port=port,
                  user=username,
                  password=password,
                  database=database,
                  connect_timeout=10,
                  cursorclass=pymysql.cursors.DictCursor,
                  autocommit=False
              )


          def execute_schema(connection):

              schema_path = os.path.join(
                  os.path.dirname(__file__),
                  "schema.sql"
              )

              with open(schema_path, "r", encoding="utf-8") as file:
                  schema = file.read()

              statements = [
                  statement.strip()
                  for statement in schema.split(";")
                  if statement.strip()
              ]

              with connection.cursor() as cursor:

                  for statement in statements:
                      cursor.execute(statement)

              connection.commit()


          def response(status_code, body):

              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type": "application/json"
                  },
                  "body": json.dumps(body, default=str)
              }


          def lambda_handler(event, context):

              connection = None

              try:

                  connection = get_db_connection()

                  method = event.get("httpMethod", "").upper()

                  path_parameters = event.get("pathParameters") or {}

                  product_id = path_parameters.get("id")


                  # ------------------------------------------------
                  # REQUEST BODY
                  # ------------------------------------------------

                  body = {}

                  if event.get("body"):

                      body = json.loads(event["body"])


                  # ------------------------------------------------
                  # TEMPORARY SCHEMA INITIALIZATION
                  # ------------------------------------------------

                  if body.get("action") == "init_schema":

                      execute_schema(connection)

                      logger.info(json.dumps({
                          "level": "INFO",
                          "service": "product-service",
                          "action": "schema_initialized",
                          "status": "success"
                      }))

                      return response(
                          200,
                          {
                              "message": "schema.sql executed successfully"
                          }
                      )


                  # ------------------------------------------------
                  # GET /products
                  # ------------------------------------------------

                  if method == "GET" and not product_id:

                      with connection.cursor() as cursor:

                          cursor.execute("""
                              SELECT
                                  id,
                                  name,
                                  description,
                                  price,
                                  category,
                                  stock_count,
                                  created_at,
                                  is_deleted,
                                  deleted_at
                              FROM products
                              WHERE is_deleted = FALSE
                              ORDER BY id
                          """)

                          products = cursor.fetchall()

                      return response(
                          200,
                          {
                              "products": products
                          }
                      )


                  # ------------------------------------------------
                  # GET /products/{id}
                  # ------------------------------------------------

                  if method == "GET" and product_id:

                      with connection.cursor() as cursor:

                          cursor.execute("""
                              SELECT
                                  id,
                                  name,
                                  description,
                                  price,
                                  category,
                                  stock_count,
                                  created_at,
                                  is_deleted,
                                  deleted_at
                              FROM products
                              WHERE id = %s
                              AND is_deleted = FALSE
                          """, (product_id,))

                          product = cursor.fetchone()

                      if not product:

                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      return response(
                          200,
                          product
                      )


                  # ------------------------------------------------
                  # POST /products
                  # ------------------------------------------------

                  if method == "POST":

                      name = body.get("name")
                      description = body.get("description")
                      price = body.get("price")
                      category = body.get("category")
                      stock_count = body.get("stock_count", 0)

                      if not name or price is None:

                          return response(
                              400,
                              {
                                  "message": "name and price are required"
                              }
                          )

                      with connection.cursor() as cursor:

                          cursor.execute("""
                              INSERT INTO products
                              (
                                  name,
                                  description,
                                  price,
                                  category,
                                  stock_count
                              )
                              VALUES
                              (
                                  %s,
                                  %s,
                                  %s,
                                  %s,
                                  %s
                              )
                          """, (
                              name,
                              description,
                              price,
                              category,
                              stock_count
                          ))

                          new_product_id = cursor.lastrowid

                      connection.commit()

                      return response(
                          201,
                          {
                              "message": "Product created successfully",
                              "product_id": new_product_id
                          }
                      )


                  # ------------------------------------------------
                  # PUT /products/{id}
                  # ------------------------------------------------

                  if method == "PUT" and product_id:

                      name = body.get("name")
                      description = body.get("description")
                      price = body.get("price")
                      category = body.get("category")
                      stock_count = body.get("stock_count")

                      with connection.cursor() as cursor:

                          cursor.execute("""
                              UPDATE products
                              SET
                                  name = %s,
                                  description = %s,
                                  price = %s,
                                  category = %s,
                                  stock_count = %s
                              WHERE id = %s
                              AND is_deleted = FALSE
                          """, (
                              name,
                              description,
                              price,
                              category,
                              stock_count,
                              product_id
                          ))

                          affected_rows = cursor.rowcount

                      connection.commit()

                      if affected_rows == 0:

                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      return response(
                          200,
                          {
                              "message": "Product updated successfully",
                              "product_id": product_id
                          }
                      )


                  # ------------------------------------------------
                  # DELETE /products/{id}
                  # ------------------------------------------------

                  if method == "DELETE" and product_id:

                      with connection.cursor() as cursor:

                          cursor.execute("""
                              UPDATE products
                              SET
                                  is_deleted = TRUE,
                                  deleted_at = CURRENT_TIMESTAMP
                              WHERE id = %s
                              AND is_deleted = FALSE
                          """, (product_id,))

                          affected_rows = cursor.rowcount

                      connection.commit()

                      if affected_rows == 0:

                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      return response(
                          200,
                          {
                              "message": "Product deleted successfully",
                              "product_id": product_id
                          }
                      )


                  return response(
                      405,
                      {
                          "message": "Method or path not supported"
                      }
                  )


              except Exception as error:

                  if connection:

                      connection.rollback()

                  logger.error(json.dumps({
                      "level": "ERROR",
                      "service": "product-service",
                      "action": "request_failed",
                      "error": str(error)
                  }))

                  return response(
                      500,
                      {
                          "message": "Database operation failed",
                          "error": str(error)
                      }
                  )


              finally:

                  if connection:

                      connection.close()


  # ============================================================
  # API GATEWAY PERMISSION TO INVOKE PRODUCT LAMBDA
  # ============================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ProductLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub
          - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*
          - ApiId:
              !Ref CloudMartApi


  # ============================================================
  # POST /products
  # ============================================================

  CreateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: POST

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products
  # ============================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductsResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # GET /products/{id}
  # ============================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: GET

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # PUT /products/{id}
  # ============================================================

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: PUT

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # DELETE /products/{id}
  # ============================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method

    Properties:

      RestApiId:
        !Ref CloudMartApi

      ResourceId:
        !Ref ProductIdResource

      HttpMethod: DELETE

      AuthorizationType: CUSTOM

      AuthorizerId:
        !Ref CloudMartAuthorizer

      Integration:

        Type: AWS_PROXY

        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn:
                !GetAtt ProductLambda.Arn


  # ============================================================
  # API GATEWAY DEPLOYMENT
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:

      - CreateProductMethod
      - GetProductsMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

    Properties:

      RestApiId:
        !Ref CloudMartApi


  # ============================================================
  # API GATEWAY STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage

    Properties:

      RestApiId:
        !Ref CloudMartApi

      DeploymentId:
        !Ref ApiDeployment

      StageName:
        !Ref Environment


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ApiId:
    Description: CloudMart API Gateway REST API ID

    Value:
      !Ref CloudMartApi

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiId


  ApiUrl:
    Description: CloudMart API Gateway URL

    Value:
      !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiUrl


  ProductLambdaArn:
    Description: CloudMart Product Service Lambda ARN

    Value:
      !GetAtt ProductLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaArn


  AuthorizerId:
    Description: API Gateway Lambda Authorizer ID

    Value:
      !Ref CloudMartAuthorizer

    Export:
      Name:
        !Sub CloudMart-${Environment}-ApiAuthorizerId