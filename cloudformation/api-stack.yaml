AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart API Stack.
  Creates API Gateway, Lambda Authorizer integration,
  Product Service Lambda, Order Processor Lambda,
  Product API endpoints, and Order API endpoints.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


Resources:

  # ============================================================
  # API GATEWAY
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub CloudMart-${Environment}-API
      Description: !Sub CloudMart ${Environment} REST API
      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # PRODUCTS RESOURCE
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products


  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  # ============================================================
  # ORDERS RESOURCE
  # ============================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders


  OrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"


  # ============================================================
  # LAMBDA AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub CloudMart-${Environment}-Authorizer
      RestApiId: !Ref CloudMartApi
      Type: TOKEN

      IdentitySource: method.request.header.Authorization

      AuthorizerUri:
        !Sub
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue:
                Fn::Sub: CloudMart-${Environment}-AuthorizerFunctionArn

      # Keep this at 1 second while testing role-based access.
      AuthorizerResultTtlInSeconds: 1


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-ProductService
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 256

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-ApplicationLambdaRoleArn

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DatabasePasswordParameterName

      Code:
        S3Bucket: cloudmart-dev-reports-062585739401-ap-south-1
        S3Key: lambda/product-lambda.zip


  # ============================================================
  # ORDER PROCESSOR LAMBDA
  # ============================================================

  OrderProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-OrderProcessor
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 256

      Role:
        Fn::ImportValue:
          Fn::Sub: CloudMart-${Environment}-OrderProcessorLambdaRoleArn

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          DB_PASSWORD:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DatabasePasswordParameterName

      Code:
        S3Bucket: cloudmart-dev-reports-062585739401-ap-south-1
        S3Key: lambda/order-processor.zip


  # ============================================================
  # PRODUCT API METHODS
  # ============================================================

  # POST /products

  CreateProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # GET /products

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # GET /products/{id}

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # PUT /products/{id}

  UpdateProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # DELETE /products/{id}

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # ORDER API METHODS
  # ============================================================

  # POST /orders

  CreateOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn


  # GET /orders

  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn


  # GET /orders/{id}

  GetOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn


  # PATCH /orders/{id}
  #
  # Used to cancel an existing confirmed order.
  #
  # Request body:
  # {
  #   "status": "cancelled"
  # }

  CancelOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: PATCH

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          !Sub
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderProcessorLambdaArn}/invocations
            - OrderProcessorLambdaArn: !GetAtt OrderProcessorLambda.Arn


  # ============================================================
  # LAMBDA PERMISSIONS
  # ============================================================

  ProductLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  OrderProcessorLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderProcessorLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  ApiDeploymentV2:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - CreateProductMethod
      - GetProductsMethod
      - GetProductMethod
      - UpdateProductMethod
      - DeleteProductMethod

      - CreateOrderMethod
      - GetOrdersMethod
      - GetOrderMethod
      - CancelOrderMethod

    Properties:
      RestApiId: !Ref CloudMartApi


  # ============================================================
  # API STAGE
  # ============================================================

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref ApiDeploymentV2
      StageName: !Ref Environment


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub CloudMart-${Environment}-ApiId


  ApiUrl:
    Description: CloudMart API URL
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub CloudMart-${Environment}-ApiUrl


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn


  OrderProcessorLambdaArn:
    Description: Order Processor Lambda ARN
    Value: !GetAtt OrderProcessorLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaArn


  AuthorizerId:
    Description: API Gateway Authorizer ID
    Value: !Ref CloudMartAuthorizer
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerId
