AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network Stack.
  Creates the VPC, public and private subnets, Internet Gateway,
  route tables, security groups, and VPC endpoints required by
  the approved CloudMart architecture.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name.


Resources:

  # ============================================================
  # VPC
  # ============================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-VPC


  # ============================================================
  # INTERNET GATEWAY
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-IGW


  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ============================================================
  # PUBLIC SUBNET
  # ============================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Public-Subnet


  # ============================================================
  # PRIVATE SUBNET 1
  #
  # Existing private subnet in ap-south-1b.
  # ============================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false

      AvailabilityZone: ap-south-1b

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Private-Subnet-1


  # ============================================================
  # PRIVATE SUBNET 2
  #
  # IMPORTANT:
  # This is intentionally a NEW logical resource.
  #
  # The old PrivateSubnet2 was already created in ap-south-1b.
  # CloudFormation cannot move an existing subnet to another AZ.
  #
  # This new resource creates the second subnet in ap-south-1c.
  #
  # RDS DB Subnet Group requires subnets in at least two AZs.
  # ============================================================

  PrivateSubnet2AzC:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false

      AvailabilityZone: ap-south-1c

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Private-Subnet-2


  # ============================================================
  # PUBLIC ROUTE TABLE
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Public-RT


  # ============================================================
  # PUBLIC ROUTE
  # ============================================================

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn: InternetGatewayAttachment

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  # ============================================================
  # PUBLIC SUBNET ROUTE TABLE ASSOCIATION
  # ============================================================

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable


  # ============================================================
  # PRIVATE ROUTE TABLE
  #
  # No NAT Gateway is used.
  # AWS services are accessed using VPC endpoints.
  # ============================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Private-RT


  # ============================================================
  # PRIVATE SUBNET 1 ROUTE TABLE ASSOCIATION
  # ============================================================

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable


  # ============================================================
  # PRIVATE SUBNET 2 ROUTE TABLE ASSOCIATION
  # ============================================================

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet2AzC
      RouteTableId: !Ref PrivateRouteTable


  # ============================================================
  # LAMBDA SECURITY GROUP
  # ============================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart Lambda functions
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:

        # HTTPS outbound traffic
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS outbound traffic

        # MySQL traffic inside VPC
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 10.0.0.0/16
          Description: Allow MySQL traffic inside CloudMart VPC

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Lambda-SG


  # ============================================================
  # RDS SECURITY GROUP
  #
  # Only Lambda security group can access RDS MySQL.
  # ============================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart RDS MySQL
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow MySQL only from CloudMart Lambda functions

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound response traffic

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-RDS-SG


  # ============================================================
  # VPC ENDPOINT SECURITY GROUP
  # ============================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for CloudMart interface VPC endpoints
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow HTTPS from CloudMart Lambda functions

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow endpoint response traffic

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-VPCEndpoint-SG


  # ============================================================
  # S3 GATEWAY VPC ENDPOINT
  # ============================================================

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-S3-Endpoint


  # ============================================================
  # SSM INTERFACE VPC ENDPOINT
  # ============================================================

  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      PrivateDnsEnabled: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-SSM-Endpoint


  # ============================================================
  # EVENTBRIDGE INTERFACE VPC ENDPOINT
  # ============================================================

  EventBridgeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.events
      VpcEndpointType: Interface

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      PrivateDnsEnabled: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-EventBridge-Endpoint


  # ============================================================
  # SNS INTERFACE VPC ENDPOINT
  # ============================================================

  SNSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      VpcEndpointType: Interface

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      PrivateDnsEnabled: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-SNS-Endpoint


# ================================================================
# OUTPUTS
# ================================================================

Outputs:


  # ============================================================
  # VPC ID
  # ============================================================

  VPCId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC

    Export:
      Name: !Sub CloudMart-${Environment}-VPCId


  # ============================================================
  # PUBLIC SUBNET ID
  # ============================================================

  PublicSubnetId:
    Description: CloudMart public subnet ID
    Value: !Ref PublicSubnet

    Export:
      Name: !Sub CloudMart-${Environment}-PublicSubnetId


  # ============================================================
  # PRIVATE SUBNET 1 ID
  # ============================================================

  PrivateSubnetId:
    Description: CloudMart private subnet ID
    Value: !Ref PrivateSubnet

    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnetId


  # ============================================================
  # PRIVATE SUBNET 2 ID
  #
  # IMPORTANT:
  # Export name remains the SAME so the Data Stack does not
  # need to be changed.
  # ============================================================

  PrivateSubnet2Id:
    Description: CloudMart second private subnet ID for RDS DB subnet group
    Value: !Ref PrivateSubnet2AzC

    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnet2Id


  # ============================================================
  # LAMBDA SECURITY GROUP ID
  # ============================================================

  LambdaSecurityGroupId:
    Description: CloudMart Lambda security group ID
    Value: !Ref LambdaSecurityGroup

    Export:
      Name: !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  # ============================================================
  # RDS SECURITY GROUP ID
  # ============================================================

  RDSSecurityGroupId:
    Description: CloudMart RDS security group ID
    Value: !Ref RDSSecurityGroup

    Export:
      Name: !Sub CloudMart-${Environment}-RDSSecurityGroupId


  # ============================================================
  # VPC ENDPOINT SECURITY GROUP ID
  # ============================================================

  VPCEndpointSecurityGroupId:
    Description: CloudMart VPC endpoint security group ID
    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: !Sub CloudMart-${Environment}-VPCEndpointSecurityGroupId


  # ============================================================
  # PRIVATE ROUTE TABLE ID
  # ============================================================

  PrivateRouteTableId:
    Description: CloudMart private route table ID
    Value: !Ref PrivateRouteTable

    Export:
      Name: !Sub CloudMart-${Environment}-PrivateRouteTableId
