AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart EC2 Flask Dashboard Stack.
  Creates the EC2 instance, IAM role and dashboard infrastructure.

Parameters:

  Environment:
    Type: String

    AllowedValues:
      - dev
      - prod

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


Resources:

  # ============================================================
  # EC2 IAM ROLE
  # ============================================================

  DashboardInstanceRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-Dashboard-EC2-Role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ========================================================
        # SSM PARAMETER STORE ACCESS
        # ========================================================

        - PolicyName: DashboardSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/storage/reports-bucket


        # ========================================================
        # S3 ACCESS
        # ========================================================

        - PolicyName: DashboardS3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}/*


  # ============================================================
  # INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-Dashboard-InstanceProfile

      Roles:
        - !Ref DashboardInstanceRole


  # ============================================================
  # EC2 INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      IamInstanceProfile:
        !Ref DashboardInstanceProfile

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


      # ============================================================
      # USERDATA
      #
      # The dashboard application files are no longer embedded here.
      #
      # GitHub Actions uploads:
      #
      # dashboard/app.py
      # dashboard/requirements.txt
      # dashboard/templates/index.html
      #
      # to the existing CloudMart reports S3 bucket.
      #
      # EC2 downloads those files during startup.
      #
      # This keeps UserData well below the EC2 25,600-byte limit.
      # ============================================================

      UserData:

        Fn::Base64:

          !Sub |
            #!/bin/bash

            # ====================================================
            # USERDATA LOGGING
            # ====================================================

            exec > >(tee /var/log/cloudmart-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1

            echo "===================================================="
            echo "CloudMart Dashboard UserData started"
            echo "===================================================="

            set -e


            # ====================================================
            # SYSTEM UPDATE
            # ====================================================

            echo "Updating system..."

            dnf update -y


            # ====================================================
            # INSTALL REQUIRED PACKAGES
            # ====================================================

            echo "Installing Python, Nginx, AWS CLI, curl and SSM Agent..."

            dnf install -y \
              python3 \
              python3-pip \
              nginx \
              amazon-ssm-agent \
              awscli 
            # ====================================================
            # START SSM AGENT
            # ====================================================

            echo "Starting Amazon SSM Agent..."

            systemctl enable amazon-ssm-agent

            systemctl start amazon-ssm-agent

            systemctl status amazon-ssm-agent --no-pager || true


            # ====================================================
            # CREATE DASHBOARD DIRECTORY
            # ====================================================

            echo "Creating dashboard directory..."

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard/templates


            # ====================================================
            # GET REPORTS BUCKET NAME FROM SSM
            # ====================================================

            echo "Getting CloudMart reports bucket name..."

            REPORTS_BUCKET=$(aws ssm get-parameter \
              --name "/cloudmart/${Environment}/storage/reports-bucket" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text \
              --region ${AWS::Region})

            echo "Reports bucket: $REPORTS_BUCKET"


            # ====================================================
            # DOWNLOAD DASHBOARD APPLICATION
            # ====================================================

            echo "Downloading app.py..."

            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/app.py" \
              /opt/cloudmart-dashboard/app.py \
              --region ${AWS::Region}


            echo "Downloading requirements.txt..."

            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/requirements.txt" \
              /opt/cloudmart-dashboard/requirements.txt \
              --region ${AWS::Region}


            echo "Downloading index.html..."

            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/templates/index.html" \
              /opt/cloudmart-dashboard/templates/index.html \
              --region ${AWS::Region}


            # ====================================================
            # VERIFY DASHBOARD FILES
            # ====================================================

            echo "Verifying dashboard files..."

            test -f /opt/cloudmart-dashboard/app.py

            test -f /opt/cloudmart-dashboard/requirements.txt

            test -f /opt/cloudmart-dashboard/templates/index.html

            echo "Dashboard files downloaded successfully."


            # ====================================================
            # INSTALL PYTHON DEPENDENCIES
            # ====================================================

            echo "Installing Python dependencies..."

            python3 -m pip install \
              -r /opt/cloudmart-dashboard/requirements.txt


            # ====================================================
            # VERIFY GUNICORN
            # ====================================================

            echo "Checking Gunicorn installation..."

            command -v gunicorn

            gunicorn --version


            # ====================================================
            # CREATE FLASK SECRET
            # ====================================================

            echo "Creating Flask secret..."

            if [ ! -f /opt/cloudmart-dashboard/.flask_secret ]; then

              python3 -c \
                "import secrets; print(secrets.token_hex(32))" \
                > /opt/cloudmart-dashboard/.flask_secret

            fi


            # ====================================================
            # CREATE SYSTEMD SERVICE
            # ====================================================

            echo "Creating CloudMart dashboard systemd service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICE'
            [Unit]
            Description=CloudMart Flask Dashboard
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=root
            WorkingDirectory=/opt/cloudmart-dashboard

            Environment="ENVIRONMENT=${Environment}"
            Environment="AWS_REGION=${AWS::Region}"

            ExecStart=/usr/local/bin/gunicorn --workers 2 --bind 127.0.0.1:5000 app:app

            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            SERVICE


            # ====================================================
            # CONFIGURE NGINX
            # ====================================================

            echo "Configuring Nginx..."

            cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'
            server {

                listen 80;

                server_name _;

                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }
            NGINX


            # ====================================================
            # START DASHBOARD SERVICE
            # ====================================================

            echo "Starting CloudMart dashboard..."

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard

            sleep 5

            systemctl status cloudmart-dashboard --no-pager || true


            # ====================================================
            # TEST FLASK APPLICATION
            # ====================================================

            echo "Testing Flask health endpoint..."

            curl --fail http://127.0.0.1:5000/health


            # ====================================================
            # START NGINX
            # ====================================================

            echo "Starting Nginx..."

            systemctl enable nginx

            nginx -t

            systemctl restart nginx


            # ====================================================
            # FINAL STATUS
            # ====================================================

            echo "===================================================="
            echo "CloudMart Dashboard UserData completed successfully"
            echo "===================================================="

            systemctl status amazon-ssm-agent --no-pager || true

            systemctl status cloudmart-dashboard --no-pager || true

            systemctl status nginx --no-pager || true


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardInstanceId:

    Description: CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description: CloudMart dashboard public IP

    Value:
      !GetAtt DashboardEC2.PublicIp


  DashboardURL:

    Description: CloudMart dashboard URL

    Value:
      !Sub http://${DashboardEC2.PublicIp}


  DashboardInstanceRoleArn:

    Description: CloudMart dashboard EC2 IAM role ARN

    Value:
      !GetAtt DashboardInstanceRole.Arn
