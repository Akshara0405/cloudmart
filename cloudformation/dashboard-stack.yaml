AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart EC2 Flask Dashboard Stack.
  Creates the EC2 instance, IAM role and dashboard infrastructure.

Parameters:

  Environment:
    Type: String

    AllowedValues:
      - dev
      - prod

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


Resources:

  # ============================================================
  # EC2 IAM ROLE
  # ============================================================

  DashboardInstanceRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-Dashboard-EC2-Role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ========================================================
        # SSM PARAMETER STORE ACCESS
        # ========================================================

        - PolicyName: DashboardSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/storage/reports-bucket


        # ========================================================
        # S3 ACCESS
        # ========================================================

        - PolicyName: DashboardS3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}

              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}/*


  # ============================================================
  # INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-Dashboard-InstanceProfile

      Roles:
        - !Ref DashboardInstanceRole


  # ============================================================
  # EC2 INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      IamInstanceProfile:
        !Ref DashboardInstanceProfile

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


      # ============================================================
      # USERDATA
      #
      # Keeps UserData tiny on purpose. All install/update logic lives in
      # an install script (deploy.sh) that the deploy-dashboard job in
      # .github/workflows/deploy.yaml generates and uploads to the reports
      # S3 bucket together with app.py, requirements.txt and
      # templates/index.html.
      #
      # On first boot this script:
      #   1. reads the reports bucket name from SSM Parameter Store
      #   2. downloads deploy.sh from S3
      #   3. runs it -> installs nginx / Python / gunicorn, downloads the
      #      app, creates the systemd service + nginx config and starts
      #      the dashboard.
      #
      # GitHub Actions runs the very same script through SSM on every
      # deploy, so no manual SSM session is ever needed.
      # ============================================================

      UserData:

        Fn::Base64:

          !Sub |
            #!/bin/bash
            exec > >(tee /var/log/cloudmart-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1
            set -euo pipefail

            echo "CloudMart Dashboard UserData started"

            export HOME=/root
            export ENVIRONMENT=${Environment}
            export AWS_REGION=${AWS::Region}

            mkdir -p /opt/cloudmart-dashboard

            # Bucket name from SSM (retry: IAM / network can take a moment)
            REPORTS_BUCKET=""
            for attempt in $(seq 1 30); do
              REPORTS_BUCKET=$(aws ssm get-parameter \
                --name "/cloudmart/${Environment}/storage/reports-bucket" \
                --query "Parameter.Value" --output text \
                --region ${AWS::Region} || true)
              if [ -n "$REPORTS_BUCKET" ] && [ "$REPORTS_BUCKET" != "None" ]; then
                break
              fi
              echo "Reports bucket not available yet ($attempt/30)"
              sleep 10
            done
            export REPORTS_BUCKET
            echo "Reports bucket: $REPORTS_BUCKET"

            # Download the deploy script (retry until GitHub Actions has uploaded it)
            for attempt in $(seq 1 30); do
              if aws s3 cp "s3://$REPORTS_BUCKET/dashboard/deploy.sh" \
                   /opt/cloudmart-dashboard/deploy.sh --region ${AWS::Region}; then
                break
              fi
              echo "deploy.sh not available yet ($attempt/30)"
              sleep 10
            done

            sed -i 's/\r$//' /opt/cloudmart-dashboard/deploy.sh

            # Install everything and start the dashboard
            bash /opt/cloudmart-dashboard/deploy.sh

            echo "CloudMart Dashboard UserData completed successfully"


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardInstanceId:

    Description: CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description: CloudMart dashboard public IP

    Value:
      !GetAtt DashboardEC2.PublicIp


  DashboardURL:

    Description: CloudMart dashboard URL

    Value:
      !Sub http://${DashboardEC2.PublicIp}


  DashboardInstanceRoleArn:

    Description: CloudMart dashboard EC2 IAM role ARN

    Value:
      !GetAtt DashboardInstanceRole.Arn
