AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart EC2 Flask Dashboard Stack.
  Creates the EC2 instance, IAM role and dashboard infrastructure.

Parameters:

  Environment:
    Type: String

    AllowedValues:
      - dev
      - prod

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


Resources:

  # ============================================================
  # EC2 IAM ROLE
  # ============================================================

  DashboardInstanceRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-Dashboard-EC2-Role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ========================================================
        # SSM PARAMETER STORE ACCESS
        # ========================================================

        - PolicyName: DashboardSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/storage/reports-bucket


        # ========================================================
        # S3 ACCESS
        # ========================================================

        - PolicyName: DashboardS3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}


              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}/*


  # ============================================================
  # INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-Dashboard-InstanceProfile

      Roles:
        - !Ref DashboardInstanceRole


  # ============================================================
  # EC2 INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      IamInstanceProfile:
        !Ref DashboardInstanceProfile

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId


      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


      # ============================================================
      # USERDATA
      #
      # IMPORTANT:
      #
      # UserData is ONLY responsible for bootstrapping the EC2.
      #
      # GitHub Actions is responsible for downloading the latest
      # dashboard application and installing Python dependencies.
      #
      # This prevents UserData from failing because of:
      #
      # - S3 application files
      # - pip installation
      # - Gunicorn
      # - Flask health checks
      #
      # ============================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash


            # ====================================================
            # USERDATA LOGGING
            # ====================================================

            exec > >(tee /var/log/cloudmart-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1


            echo "===================================================="

            echo "CloudMart Dashboard UserData started"

            echo "===================================================="


            # Do NOT use set -e here.
            #
            # Bootstrap must reach the completion marker even if
            # an individual non-critical command has an issue.


            # ====================================================
            # SYSTEM UPDATE
            # ====================================================

            echo "Updating system..."

            dnf update -y || echo "WARNING: dnf update failed"


            # ====================================================
            # INSTALL REQUIRED PACKAGES
            # ====================================================

            echo "Installing required packages..."

            dnf install -y \
              python3 \
              python3-pip \
              nginx \
              amazon-ssm-agent \
              awscli \
              curl \
              || echo "WARNING: package installation encountered an error"


            # ====================================================
            # VERIFY BASIC COMMANDS
            # ====================================================

            echo "Checking installed commands..."

            command -v python3 || true

            command -v pip3 || true

            command -v nginx || true

            command -v aws || true

            command -v curl || true


            # ====================================================
            # START SSM AGENT
            # ====================================================

            echo "Starting Amazon SSM Agent..."

            systemctl enable amazon-ssm-agent || true

            systemctl restart amazon-ssm-agent || true

            systemctl status amazon-ssm-agent --no-pager || true


            # ====================================================
            # CREATE DASHBOARD DIRECTORIES
            # ====================================================

            echo "Creating dashboard directories..."

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard/templates


            # ====================================================
            # CREATE FLASK SECRET
            # ====================================================

            echo "Creating Flask secret if required..."

            if [ ! -f /opt/cloudmart-dashboard/.flask_secret ]; then

              python3 -c \
                "import secrets; print(secrets.token_hex(32))" \
                > /opt/cloudmart-dashboard/.flask_secret \
                || true

            fi


            # ====================================================
            # CREATE SYSTEMD SERVICE
            # ====================================================

            echo "Creating CloudMart dashboard systemd service..."


            cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICE'

            [Unit]
            Description=CloudMart Flask Dashboard
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=root
            WorkingDirectory=/opt/cloudmart-dashboard

            Environment="ENVIRONMENT=${Environment}"
            Environment="AWS_REGION=${AWS::Region}"

            ExecStart=/usr/local/bin/gunicorn --workers 2 --bind 127.0.0.1:5000 app:app

            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target

            SERVICE


            # ====================================================
            # CONFIGURE NGINX
            # ====================================================

            echo "Configuring Nginx..."


            cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'

            server {

                listen 80;

                server_name _;

                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }

            NGINX


            # ====================================================
            # ENABLE NGINX
            # ====================================================

            echo "Preparing Nginx..."

            systemctl enable nginx || true

            nginx -t || true


            # ====================================================
            # RELOAD SYSTEMD
            # ====================================================

            systemctl daemon-reload || true

            systemctl enable cloudmart-dashboard || true


            # ====================================================
            # USERDATA COMPLETION MARKER
            #
            # This is the important part.
            #
            # GitHub Actions will wait for this file instead of
            # waiting for cloudmart-dashboard.service.
            # ====================================================

            echo "Creating UserData completion marker..."

            touch /opt/cloudmart-dashboard/.userdata-complete


            # ====================================================
            # FINAL STATUS
            # ====================================================

            echo "===================================================="

            echo "CloudMart Dashboard UserData completed"

            echo "===================================================="

            echo "UserData completion marker created."


            systemctl status amazon-ssm-agent --no-pager || true

            systemctl status nginx --no-pager || true


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardInstanceId:

    Description: CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description: CloudMart dashboard public IP

    Value:
      !GetAtt DashboardEC2.PublicIp


  DashboardURL:

    Description: CloudMart dashboard URL

    Value:
      !Sub http://${DashboardEC2.PublicIp}


  DashboardInstanceRoleArn:

    Description: CloudMart dashboard EC2 IAM role ARN

    Value:
      !GetAtt DashboardInstanceRole.Arn