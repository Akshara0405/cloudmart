AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart EC2 Flask Dashboard Stack.
  Creates the EC2 instance, IAM role and dashboard infrastructure.

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64


Resources:

  # ============================================================
  # EC2 IAM ROLE
  # ============================================================

  DashboardInstanceRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-Dashboard-EC2-Role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:

        # ======================================================
        # SSM ACCESS
        # ======================================================

        - PolicyName: DashboardSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password

                  - !Sub
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/storage/reports-bucket


        # ======================================================
        # S3 ACCESS
        # ======================================================

        - PolicyName: DashboardS3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}


              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource:

                  - !Sub
                    arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}/*


  # ============================================================
  # INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub CloudMart-${Environment}-Dashboard-InstanceProfile

      Roles:

        - !Ref DashboardInstanceRole


  # ============================================================
  # EC2 INSTANCE
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      IamInstanceProfile:
        !Ref DashboardInstanceProfile

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId

      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


      # ========================================================
      # SMALL USERDATA
      # ========================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash

            set -e

            exec > >(tee /var/log/cloudmart-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1


            echo "===================================================="
            echo "CloudMart Dashboard UserData started"
            echo "===================================================="


            # ==================================================
            # SYSTEM UPDATE
            # ==================================================

            echo "Updating system..."

            dnf update -y


            # ==================================================
            # INSTALL REQUIRED PACKAGES
            # ==================================================

            echo "Installing required packages..."

            dnf install -y \
              python3 \
              python3-pip \
              nginx \
              awscli-2 \
              amazon-ssm-agent


            # ==================================================
            # START SSM AGENT
            # ==================================================

            systemctl enable amazon-ssm-agent

            systemctl start amazon-ssm-agent


            # ==================================================
            # CREATE DASHBOARD DIRECTORIES
            # ==================================================

            mkdir -p /opt/cloudmart-dashboard

            mkdir -p /opt/cloudmart-dashboard/templates


            # ==================================================
            # CREATE FLASK SECRET
            # ==================================================

            if [ ! -f /opt/cloudmart-dashboard/.flask_secret ]; then

              python3 -c \
                "import secrets; print(secrets.token_hex(32))" \
                > /opt/cloudmart-dashboard/.flask_secret

              chmod 600 \
                /opt/cloudmart-dashboard/.flask_secret

            fi


            # ==================================================
            # REPORTS BUCKET
            # ==================================================

            REPORTS_BUCKET="cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}"


            # ==================================================
            # DOWNLOAD DASHBOARD APPLICATION
            # ==================================================

            echo "Downloading dashboard application..."

            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/app.py" \
              /opt/cloudmart-dashboard/app.py \
              --region "${AWS::Region}"


            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/requirements.txt" \
              /opt/cloudmart-dashboard/requirements.txt \
              --region "${AWS::Region}"


            aws s3 cp \
              "s3://$REPORTS_BUCKET/dashboard/templates/index.html" \
              /opt/cloudmart-dashboard/templates/index.html \
              --region "${AWS::Region}"


            # ==================================================
            # INSTALL PYTHON DEPENDENCIES
            # ==================================================

            echo "Installing Python dependencies..."

            python3 -m pip install \
              -r /opt/cloudmart-dashboard/requirements.txt


            # ==================================================
            # VERIFY GUNICORN
            # ==================================================

            echo "Checking Gunicorn..."

            command -v gunicorn

            gunicorn --version


            # ==================================================
            # CREATE SYSTEMD SERVICE
            # ==================================================

            echo "Creating CloudMart dashboard service..."

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE

            [Unit]
            Description=CloudMart Flask Dashboard
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=root
            WorkingDirectory=/opt/cloudmart-dashboard

            Environment="ENVIRONMENT=${Environment}"
            Environment="AWS_REGION=${AWS::Region}"

            ExecStart=/usr/local/bin/gunicorn --workers 2 --bind 127.0.0.1:5000 app:app

            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target

            SERVICE


            # ==================================================
            # REMOVE DEFAULT NGINX CONFIGURATION
            # ==================================================

            echo "Removing default Nginx configuration..."

            rm -f /etc/nginx/conf.d/default.conf


            # ==================================================
            # CREATE NGINX CONFIGURATION
            # ==================================================

            echo "Creating CloudMart Nginx configuration..."

            cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'

            server {

                listen 80;

                server_name _;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }

            NGINX


            # ==================================================
            # START GUNICORN
            # ==================================================

            echo "Starting CloudMart dashboard..."

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            # ==================================================
            # WAIT FOR APPLICATION
            # ==================================================

            sleep 5


            # ==================================================
            # HEALTH CHECK
            # ==================================================

            echo "Testing Flask application..."

            curl --fail \
              http://127.0.0.1:5000/health


            # ==================================================
            # START NGINX
            # ==================================================

            echo "Starting Nginx..."

            nginx -t

            systemctl enable nginx

            systemctl restart nginx


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo "===================================================="
            echo "CloudMart Dashboard UserData completed successfully"
            echo "===================================================="

            systemctl status cloudmart-dashboard --no-pager || true

            systemctl status nginx --no-pager || true

            systemctl status amazon-ssm-agent --no-pager || true


Outputs:

  DashboardInstanceId:

    Description: CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description: CloudMart dashboard public IP

    Value:
      !GetAtt DashboardEC2.PublicIp


  DashboardURL:

    Description: CloudMart dashboard URL

    Value:
      !Sub http://${DashboardEC2.PublicIp}


  DashboardInstanceRoleArn:

    Description: CloudMart dashboard EC2 IAM role ARN

    Value:
      !GetAtt DashboardInstanceRole.Arn
    