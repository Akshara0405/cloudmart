AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart RDS Data Stack

Parameters:

  DBName:
    Type: String
    Default: cloudmart

  DBUsername:
    Type: String
    Default: admin

  DBPassword:
    Type: String
    NoEcho: true

Resources:

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart DB Subnet Group
      SubnetIds:
        - Fn::ImportValue: CloudMart-dev-PrivateSubnetId
        - Fn::ImportValue: CloudMart-dev-PrivateSubnet2Id

  CloudMartDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: cloudmart-db

      Engine: mysql
      EngineVersion: "8.0.46"

      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20

      StorageType: gp3
      StorageEncrypted: true

      PubliclyAccessible: false
      MultiAZ: false

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword

      DBSubnetGroupName: !Ref DBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue: CloudMart-dev-RDSSecurityGroupId

      BackupRetentionPeriod: 7
      DeletionProtection: false

Outputs:

  DBIdentifier:
    Description: RDS Instance Identifier
    Value: !Ref CloudMartDB

  DBEndpoint:
    Description: RDS Endpoint
    Value: !GetAtt CloudMartDB.Endpoint.Address

  DBPort:
    Description: RDS Port
    Value: !GetAtt CloudMartDB.Endpoint.Port