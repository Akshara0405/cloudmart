AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Data Stack Test

Resources:

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudMartOrders-dev
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: OrderId
          AttributeType: S
        - AttributeName: CustomerId
          AttributeType: S

      KeySchema:
        - AttributeName: OrderId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - AttributeName: CustomerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket

  ReportsBucket:
    Type: AWS::S3::Bucket