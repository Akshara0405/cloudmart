AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Stack.
  Creates the RDS MySQL database, DB subnet group, S3 bucket,
  and SSM Parameter Store configuration required by the
  approved CloudMart architecture.

Parameters:

  # ============================================================
  # ENVIRONMENT
  # ============================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name.


  # ============================================================
  # DATABASE NAME
  # ============================================================

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart RDS database name.


  # ============================================================
  # DATABASE USERNAME
  # Password is NOT supplied through GitHub.
  # AWS Secrets Manager manages the RDS master password.
  # ============================================================

  DBUsername:
    Type: String
    Default: cloudmart_admin
    NoEcho: true
    Description: RDS master username.


  # ============================================================
  # RDS INSTANCE CLASS
  # ============================================================

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class.


  # ============================================================
  # RDS STORAGE
  # ============================================================

  AllocatedStorage:
    Type: Number
    Default: 20
    Description: RDS allocated storage in GB.


Resources:

  # ============================================================
  # RDS DB SUBNET GROUP
  #
  # RDS requires a DB subnet group containing subnets from
  # at least two Availability Zones.
  #
  # IMPORTANT:
  # This does NOT make the RDS instance Multi-AZ.
  # The actual RDS instance remains Single-AZ.
  # ============================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: >
        CloudMart RDS subnet group using two private subnets
        across different Availability Zones.

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-DB-Subnet-Group


  # ============================================================
  # RDS MYSQL DATABASE
  #
  # Single-AZ deployment.
  #
  # AWS Secrets Manager automatically manages the master
  # database password.
  # ============================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub CloudMart-${Environment}-RDS

      Engine: mysql

      EngineVersion: '8.0'

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      # AWS automatically creates and manages the
      # master password in AWS Secrets Manager.
      ManageMasterUserPassword: true

      Port: 3306

      PubliclyAccessible: false

      # Keep RDS Single-AZ as required by the architecture.
      MultiAZ: false

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId

      BackupRetentionPeriod: 7

      AutoMinorVersionUpgrade: true

      DeletionProtection: false

      CopyTagsToSnapshot: true

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-RDS


  # ============================================================
  # S3 BUCKET
  #
  # Used by CloudMart for application/report storage.
  # Bucket remains private.
  # ============================================================

  CloudMartS3Bucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-${AWS::AccountId}-${AWS::Region}

      AccessControl: Private

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-S3


  # ============================================================
  # SSM PARAMETERS
  #
  # These parameters provide database configuration to
  # application Lambdas.
  #
  # The database password is NOT stored here.
  # RDS master password is managed by Secrets Manager.
  # ============================================================

  DBHostParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/host

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Address

      Description:
        CloudMart RDS MySQL endpoint

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  # ============================================================
  # DB PORT PARAMETER
  # ============================================================

  DBPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/port

      Type: String

      Value: '3306'

      Description:
        CloudMart RDS MySQL port

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  # ============================================================
  # DB NAME PARAMETER
  # ============================================================

  DBNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/name

      Type: String

      Value:
        !Ref DBName

      Description:
        CloudMart RDS database name

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  # ============================================================
  # DB USERNAME PARAMETER
  # ============================================================

  DBUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/username

      Type: String

      Value:
        !Ref DBUsername

      Description:
        CloudMart RDS database username

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  # ============================================================
  # S3 BUCKET NAME PARAMETER
  #
  # Application Lambdas can retrieve the bucket name from SSM.
  # ============================================================

  S3BucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/storage/bucket

      Type: String

      Value:
        !Ref CloudMartS3Bucket

      Description:
        CloudMart private S3 bucket

      Tags:
        Environment: !Ref Environment
        Application: CloudMart


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:


  # ============================================================
  # RDS INSTANCE
  # ============================================================

  RDSInstanceIdentifier:
    Description: CloudMart RDS instance identifier

    Value:
      !Ref CloudMartRDS

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDSInstanceIdentifier


  # ============================================================
  # RDS ENDPOINT
  # ============================================================

  RDSEndpoint:
    Description: CloudMart RDS MySQL endpoint

    Value:
      !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDSEndpoint


  # ============================================================
  # RDS PORT
  # ============================================================

  RDSPort:
    Description: CloudMart RDS MySQL port

    Value:
      !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name:
        !Sub CloudMart-${Environment}-RDSPort


  # ============================================================
  # DATABASE NAME
  # ============================================================

  DBName:
    Description: CloudMart database name

    Value:
      !Ref DBName

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBName


  # ============================================================
  # DB SUBNET GROUP
  # ============================================================

  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group

    Value:
      !Ref CloudMartDBSubnetGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBSubnetGroupName


  # ============================================================
  # S3 BUCKET NAME
  # ============================================================

  S3BucketName:
    Description: CloudMart private S3 bucket

    Value:
      !Ref CloudMartS3Bucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-S3BucketName


  # ============================================================
  # S3 BUCKET ARN
  # ============================================================

  S3BucketArn:
    Description: CloudMart S3 bucket ARN

    Value:
      !GetAtt CloudMartS3Bucket.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-S3BucketArn


  # ============================================================
  # SSM - DB HOST
  # ============================================================

  DBHostParameterName:
    Description: SSM parameter containing RDS endpoint

    Value:
      !Sub /cloudmart/${Environment}/database/host

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBHostParameter


  # ============================================================
  # SSM - DB PORT
  # ============================================================

  DBPortParameterName:
    Description: SSM parameter containing RDS port

    Value:
      !Sub /cloudmart/${Environment}/database/port

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBPortParameter


  # ============================================================
  # SSM - DB NAME
  # ============================================================

  DBNameParameterName:
    Description: SSM parameter containing database name

    Value:
      !Sub /cloudmart/${Environment}/database/name

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBNameParameter


  # ============================================================
  # SSM - DB USERNAME
  # ============================================================

  DBUsernameParameterName:
    Description: SSM parameter containing database username

    Value:
      !Sub /cloudmart/${Environment}/database/username

    Export:
      Name:
        !Sub CloudMart-${Environment}-DBUsernameParameter


  # ============================================================
  # SSM - S3 BUCKET
  # ============================================================

  S3BucketParameterName:
    Description: SSM parameter containing S3 bucket name

    Value:
      !Sub /cloudmart/${Environment}/storage/bucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-S3BucketParameter