
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart RDS Data Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

  DatabaseName:
    Type: String
    Default: cloudmart

  MasterUsername:
    Type: String
    NoEcho: true

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8

  BackupRetentionPeriod:
    Type: Number
    Default: 1
    MinValue: 0


Resources:

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: CloudMart RDS private subnet group

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-DB-Subnet-Group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-db

      Engine: mysql

      EngineVersion: "8.0.46"

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true

      DBName:
        !Ref DatabaseName

      MasterUsername:
        !Ref MasterUsername

      MasterUserPassword:
        !Ref MasterUserPassword

      Port: 3306

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId

      PubliclyAccessible: false

      MultiAZ: false

      BackupRetentionPeriod:
        !Ref BackupRetentionPeriod

      AutoMinorVersionUpgrade: true

      DeletionProtection: false

      CopyTagsToSnapshot: true

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-RDS

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  CloudMartReportsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-reports-${AWS::AccountId}-${AWS::Region}

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub CloudMart-${Environment}-Reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  DBHostParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/host

      Type: String

      Value:
        !GetAtt CloudMartDatabase.Endpoint.Address

      Description: CloudMart RDS MySQL endpoint

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


  DBPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/port

      Type: String

      Value: '3306'

      Description: CloudMart RDS MySQL port

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


  DBNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/name

      Type: String

      Value:
        !Ref DatabaseName

      Description: CloudMart database name

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


  DBUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/username

      Type: String

      Value:
        !Ref MasterUsername

      Description: CloudMart RDS database username

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


  DBPasswordParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/database/password

      Type: SecureString

      Value:
        !Ref MasterUserPassword

      Description: CloudMart RDS database password

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


  S3ReportsBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/storage/reports-bucket

      Type: String

      Value:
        !Ref CloudMartReportsBucket

      Description: CloudMart reports S3 bucket

      Tags:

        Environment: !Ref Environment
        Application: CloudMart


Outputs:

  DBInstanceIdentifier:
    Description: CloudMart RDS instance identifier
    Value: !Ref CloudMartDatabase

    Export:
      Name: !Sub CloudMart-${Environment}-RDSInstanceIdentifier


  DBEndpoint:
    Description: CloudMart RDS MySQL endpoint
    Value: !GetAtt CloudMartDatabase.Endpoint.Address

    Export:
      Name: !Sub CloudMart-${Environment}-RDSEndpoint


  DBPort:
    Description: CloudMart RDS MySQL port
    Value: !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name: !Sub CloudMart-${Environment}-RDSPort


  DatabaseName:
    Description: CloudMart database name
    Value: !Ref DatabaseName

    Export:
      Name: !Sub CloudMart-${Environment}-DBName


  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group
    Value: !Ref CloudMartDBSubnetGroup

    Export:
      Name: !Sub CloudMart-${Environment}-DBSubnetGroupName


  RDSSecurityGroupId:
    Description: CloudMart RDS security group
    Value:
      Fn::ImportValue:
        Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId

    Export:
      Name: !Sub CloudMart-${Environment}-RDSSecurityGroupId


  ReportsBucketName:
    Description: CloudMart reports S3 bucket
    Value: !Ref CloudMartReportsBucket

    Export:
      Name: !Sub CloudMart-${Environment}-ReportsBucketName


  ReportsBucketArn:
    Description: CloudMart reports S3 bucket ARN
    Value: !GetAtt CloudMartReportsBucket.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ReportsBucketArn


  DBHostParameterName:
    Description: SSM parameter containing RDS endpoint
    Value:
      !Sub /cloudmart/${Environment}/database/host

    Export:
      Name: !Sub CloudMart-${Environment}-DBHostParameter


  DBPortParameterName:
    Description: SSM parameter containing RDS port
    Value:
      !Sub /cloudmart/${Environment}/database/port

    Export:
      Name: !Sub CloudMart-${Environment}-DBPortParameter


  DBNameParameterName:
    Description: SSM parameter containing database name
    Value:
      !Sub /cloudmart/${Environment}/database/name

    Export:
      Name: !Sub CloudMart-${Environment}-DBNameParameter


  DBUsernameParameterName:
    Description: SSM parameter containing database username
    Value:
      !Sub /cloudmart/${Environment}/database/username

    Export:
      Name: !Sub CloudMart-${Environment}-DBUsernameParameter


  DBPasswordParameterName:
    Description: SSM SecureString parameter containing database password
    Value:
      !Sub /cloudmart/${Environment}/database/password

    Export:
      Name: !Sub CloudMart-${Environment}-DBPasswordParameter


  ReportsBucketParameterName:
    Description: SSM parameter containing reports bucket name
    Value:
      !Sub /cloudmart/${Environment}/storage/reports-bucket

    Export:
      Name: !Sub CloudMart-${Environment}-ReportsBucketParameter

