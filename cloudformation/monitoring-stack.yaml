AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Monitoring Stack.
  Creates SNS topics, EventBridge rules, CloudWatch dashboard,
  CloudWatch alarms, and operational monitoring resources.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AlertEmail:
    Type: String
    Description: Email address to receive CloudMart alerts

  LowStockThreshold:
    Type: Number
    Default: 5
    Description: Stock level at or below which a low-stock alert is generated


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ============================================================
  # LOW STOCK SNS TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName:
        !Sub CloudMart-${Environment}-LowStockAlerts

      DisplayName:
        !Sub CloudMart ${Environment} Low Stock Alerts


  # ============================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ============================================================
  # INVENTORY CHANGE EVENTBRIDGE RULE
  #
  # InventoryChanged + low_stock=true → SNS
  # ============================================================

  InventoryChangeRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-InventoryChangeRule

      Description:
        !Sub CloudMart ${Environment} inventory low-stock event rule

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - InventoryChanged

        detail:
          low_stock:
            - true

      State: ENABLED

      Targets:

        - Arn:
            !Ref LowStockTopic

          Id:
            LowStockSNSTarget


  # ============================================================
  # LOW STOCK SNS TOPIC POLICY
  # ============================================================

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref LowStockTopic

            Condition:

              ArnEquals:
                aws:SourceArn:
                  !GetAtt InventoryChangeRule.Arn


  # ============================================================
  # ORDER CONFIRMATION SNS TOPIC
  # ============================================================

  OrderConfirmationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub CloudMart-${Environment}-OrderConfirmations

      DisplayName:
        !Sub CloudMart ${Environment} Order Confirmations


  # ============================================================
  # ORDER CONFIRMATION EMAIL SUBSCRIPTION
  # ============================================================

  OrderConfirmationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ============================================================
  # ORDER CONFIRMED EVENTBRIDGE RULE
  #
  # OrderConfirmed → SNS
  # ============================================================

  OrderConfirmedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedRule

      Description:
        !Sub CloudMart ${Environment} order confirmed notification rule

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderConfirmed

      State: ENABLED

      Targets:

        - Arn:
            !Ref OrderConfirmationTopic

          Id:
            OrderConfirmationSNSTarget


  # ============================================================
  # ORDER FAILED EVENTBRIDGE RULE
  #
  # OrderFailed → SNS
  # ============================================================

  OrderFailedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-OrderFailedRule

      Description:
        !Sub CloudMart ${Environment} order failed notification rule

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderFailed

      State: ENABLED

      Targets:

        - Arn:
            !Ref OrderConfirmationTopic

          Id:
            OrderFailedSNSTarget


  # ============================================================
  # ORDER SNS TOPIC POLICY
  #
  # Allows EventBridge to publish:
  # OrderConfirmed
  # OrderFailed
  # ============================================================

  OrderConfirmationTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowOrderConfirmedEventBridgePublish

            Effect: Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic

            Condition:

              ArnEquals:
                aws:SourceArn:
                  !GetAtt OrderConfirmedRule.Arn


          - Sid: AllowOrderFailedEventBridgePublish

            Effect: Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic

            Condition:

              ArnEquals:
                aws:SourceArn:
                  !GetAtt OrderFailedRule.Arn


  # ============================================================
  # CLOUDWATCH OPERATIONS DASHBOARD
  #
  # Dashboard name:
  # cloudmart-operations
  # ============================================================

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:

      DashboardName:
        !Sub cloudmart-operations

      DashboardBody:
        !Sub |
          {
            "widgets": [

              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API Gateway Requests",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "CloudMart-${Environment}-API",
                      "Stage",
                      "${Environment}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API Gateway Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "4XXError",
                      "ApiName",
                      "CloudMart-${Environment}-API",
                      "Stage",
                      "${Environment}"
                    ],
                    [
                      "AWS/ApiGateway",
                      "5XXError",
                      "ApiName",
                      "CloudMart-${Environment}-API",
                      "Stage",
                      "${Environment}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Invocations",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "CloudMart-${Environment}-ProductService"
                    ],
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "CloudMart-${Environment}-OrderProcessor"
                    ],
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "CloudMart-${Environment}-Authorizer"
                    ],
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "CloudMart-${Environment}-Report"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 12,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-ProductService"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-OrderProcessor"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-Authorizer"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "CloudMart-${Environment}-Report"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Duration",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Duration",
                      "FunctionName",
                      "CloudMart-${Environment}-ProductService",
                      {
                        "stat": "p50"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Duration",
                      "FunctionName",
                      "CloudMart-${Environment}-ProductService",
                      {
                        "stat": "p90"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Duration",
                      "FunctionName",
                      "CloudMart-${Environment}-OrderProcessor",
                      {
                        "stat": "p50"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Duration",
                      "FunctionName",
                      "CloudMart-${Environment}-OrderProcessor",
                      {
                        "stat": "p90"
                      }
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 12,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Business Metrics",
                  "region": "${AWS::Region}",
                  "namespace": "cloudmart",
                  "view": "timeSeries",
                  "stacked": false,
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "cloudmart",
                      "OrdersPlaced",
                      "Environment",
                      "${Environment}"
                    ],
                    [
                      "cloudmart",
                      "OrdersFailed",
                      "Environment",
                      "${Environment}"
                    ],
                    [
                      "cloudmart",
                      "LowStockEvents",
                      "Environment",
                      "${Environment}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 18,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "RDS CPU Utilization",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "AWS/RDS",
                      "CPUUtilization",
                      "DBInstanceIdentifier",
                      "cloudmart-${Environment}-db"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 8,
                "y": 18,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "RDS Database Connections",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "AWS/RDS",
                      "DatabaseConnections",
                      "DBInstanceIdentifier",
                      "cloudmart-${Environment}-db"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 16,
                "y": 18,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "RDS Free Storage",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "AWS/RDS",
                      "FreeStorageSpace",
                      "DBInstanceIdentifier",
                      "cloudmart-${Environment}-db"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 24,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "EC2 Dashboard CPU",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "AWS/EC2",
                      "CPUUtilization",
                      "InstanceId",
                      "${AWS::NoValue}"
                    ]
                  ]
                }
              },

              {
                "type": "text",
                "x": 12,
                "y": 24,
                "width": 12,
                "height": 6,
                "properties": {
                  "markdown": "# CloudMart Operations\n\n**Environment:** ${Environment}\n\nThis dashboard provides API Gateway, Lambda, RDS and business-metric visibility."
                }
              }

            ]
          }


  # ============================================================
  # ALARM 1
  #
  # Order Processor Lambda error rate > 5%
  # ============================================================

  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-LambdaErrorRate

      AlarmDescription:
        !Sub CloudMart ${Environment} Order Processor Lambda error rate exceeded 5 percent

      EvaluationPeriods: 1

      DatapointsToAlarm: 1

      Threshold: 5

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      Metrics:

        - Id: errors

          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value:
                    !Sub CloudMart-${Environment}-OrderProcessor

            Period: 300
            Stat: Sum

          ReturnData: false


        - Id: invocations

          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value:
                    !Sub CloudMart-${Environment}-OrderProcessor

            Period: 300
            Stat: Sum

          ReturnData: false


        - Id: errorrate

          Expression: "IF(invocations>0,(errors/invocations)*100,0)"

          Label: Lambda Error Rate

          ReturnData: true

      AlarmActions:
        - !Ref OrderConfirmationTopic


  # ============================================================
  # ALARM 2
  #
  # OrdersFailed >= 1
  # ============================================================

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-OrdersFailed

      AlarmDescription:
        !Sub CloudMart ${Environment} OrdersFailed metric is greater than zero

      Namespace: cloudmart

      MetricName: OrdersFailed

      Dimensions:

        - Name: Environment
          Value:
            !Ref Environment

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      DatapointsToAlarm: 1

      Threshold: 0

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OrderConfirmationTopic


  # ============================================================
  # ALARM 3
  #
  # RDS CPU > 70%
  # ============================================================

  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-RDS-CPU

      AlarmDescription:
        !Sub CloudMart ${Environment} RDS CPU utilization exceeded 70 percent

      Namespace: AWS/RDS

      MetricName: CPUUtilization

      Dimensions:

        - Name: DBInstanceIdentifier
          Value:
            !Sub cloudmart-${Environment}-db

      Statistic: Average

      Period: 300

      EvaluationPeriods: 1

      DatapointsToAlarm: 1

      Threshold: 70

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OrderConfirmationTopic


  # ============================================================
  # ALARM 4
  #
  # API Gateway 5xx error rate > 5%
  # ============================================================

  APIGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName:
        !Sub CloudMart-${Environment}-API-5xx-Rate

      AlarmDescription:
        !Sub CloudMart ${Environment} API Gateway 5xx error rate exceeded 5 percent

      EvaluationPeriods: 1

      DatapointsToAlarm: 1

      Threshold: 5

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      Metrics:

        - Id: errors5xx

          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5XXError
              Dimensions:
                - Name: ApiName
                  Value:
                    !Sub CloudMart-${Environment}-API
                - Name: Stage
                  Value:
                    !Ref Environment

            Period: 300
            Stat: Sum

          ReturnData: false


        - Id: requests

          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiName
                  Value:
                    !Sub CloudMart-${Environment}-API
                - Name: Stage
                  Value:
                    !Ref Environment

            Period: 300
            Stat: Sum

          ReturnData: false


        - Id: errorrate

          Expression: "IF(requests>0,(errors5xx/requests)*100,0)"

          Label: API Gateway 5xx Error Rate

          ReturnData: true

      AlarmActions:
        - !Ref OrderConfirmationTopic


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ============================================================
  # LOW STOCK SNS TOPIC ARN
  # ============================================================

  LowStockTopicArn:

    Description:
      SNS topic ARN for CloudMart low-stock alerts

    Value:
      !Ref LowStockTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-LowStockTopicArn


  # ============================================================
  # INVENTORY EVENTBRIDGE RULE ARN
  # ============================================================

  InventoryChangeRuleArn:

    Description:
      EventBridge inventory change rule ARN

    Value:
      !GetAtt InventoryChangeRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-InventoryChangeRuleArn


  # ============================================================
  # ORDER CONFIRMATION SNS TOPIC ARN
  # ============================================================

  OrderConfirmationTopicArn:

    Description:
      SNS topic ARN for CloudMart order confirmation notifications

    Value:
      !Ref OrderConfirmationTopic

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderConfirmationTopicArn


  # ============================================================
  # ORDER CONFIRMED EVENTBRIDGE RULE ARN
  # ============================================================

  OrderConfirmedRuleArn:

    Description:
      EventBridge rule ARN for confirmed orders

    Value:
      !GetAtt OrderConfirmedRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedRuleArn


  # ============================================================
  # ORDER FAILED EVENTBRIDGE RULE ARN
  # ============================================================

  OrderFailedRuleArn:

    Description:
      EventBridge rule ARN for failed orders

    Value:
      !GetAtt OrderFailedRule.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderFailedRuleArn


  # ============================================================
  # CLOUDWATCH DASHBOARD
  # ============================================================

  OperationsDashboardName:

    Description:
      CloudMart CloudWatch operations dashboard

    Value:
      !Sub cloudmart-operations


  # ============================================================
  # ALARM ARNS
  # ============================================================

  LambdaErrorRateAlarmArn:

    Description:
      Lambda error rate alarm ARN

    Value:
      !GetAtt LambdaErrorRateAlarm.Arn


  OrdersFailedAlarmArn:

    Description:
      Orders failed alarm ARN

    Value:
      !GetAtt OrdersFailedAlarm.Arn


  RDSCPUAlarmArn:

    Description:
      RDS CPU alarm ARN

    Value:
      !GetAtt RDSCPUAlarm.Arn


  APIGateway5xxAlarmArn:

    Description:
      API Gateway 5xx alarm ARN

    Value:
      !GetAtt APIGateway5xxAlarm.Arn
