
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Monitoring Stack.
  Creates SNS topics, email subscriptions, and EventBridge
  rules for low-stock inventory alerts, order confirmation
  notifications, and order failure notifications.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AlertEmail:
    Type: String
    Description: Email address to receive CloudMart alerts

  LowStockThreshold:
    Type: Number
    Default: 5
    Description: Stock level at or below which a low-stock alert is generated


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ============================================================
  # LOW STOCK SNS TOPIC
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName:
        !Sub CloudMart-${Environment}-LowStockAlerts

      DisplayName:
        !Sub CloudMart ${Environment} Low Stock Alerts


  # ============================================================
  # LOW STOCK EMAIL SUBSCRIPTION
  # ============================================================

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn:
        !Ref LowStockTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ============================================================
  # INVENTORY CHANGE EVENTBRIDGE RULE
  # InventoryChanged + low_stock=true → SNS
  # ============================================================

  InventoryChangeRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-InventoryChangeRule

      Description:
        !Sub CloudMart ${Environment} inventory low-stock event rule

      EventPattern:

        source:
          - cloudmart.product

        detail-type:
          - InventoryChanged

        detail:
          low_stock:
            - true

      State:
        ENABLED

      Targets:

        - Arn:
            !Ref LowStockTopic

          Id:
            LowStockSNSTarget


  # ============================================================
  # LOW STOCK SNS TOPIC POLICY
  # Allows EventBridge to publish to LowStockTopic
  # ============================================================

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowEventBridgePublish

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref LowStockTopic

            Condition:

              ArnEquals:

                aws:SourceArn:
                  !GetAtt InventoryChangeRule.Arn


  # ============================================================
  # ORDER CONFIRMATION SNS TOPIC
  # ============================================================

  OrderConfirmationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName:
        !Sub CloudMart-${Environment}-OrderConfirmations

      DisplayName:
        !Sub CloudMart ${Environment} Order Confirmations


  # ============================================================
  # ORDER CONFIRMATION EMAIL SUBSCRIPTION
  # ============================================================

  OrderConfirmationEmailSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn:
        !Ref OrderConfirmationTopic

      Protocol:
        email

      Endpoint:
        !Ref AlertEmail


  # ============================================================
  # ORDER CONFIRMED EVENTBRIDGE RULE
  # OrderConfirmed → SNS
  # ============================================================

  OrderConfirmedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedRule

      Description:
        !Sub CloudMart ${Environment} order confirmed notification rule

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderConfirmed

      State:
        ENABLED

      Targets:

        - Arn:
            !Ref OrderConfirmationTopic

          Id:
            OrderConfirmationSNSTarget


  # ============================================================
  # ORDER FAILED EVENTBRIDGE RULE
  # OrderFailed → SNS
  # ============================================================

  OrderFailedRule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-OrderFailedRule

      Description:
        !Sub CloudMart ${Environment} order failed notification rule

      EventPattern:

        source:
          - cloudmart.order

        detail-type:
          - OrderFailed

      State:
        ENABLED

      Targets:

        - Arn:
            !Ref OrderConfirmationTopic

          Id:
            OrderFailedSNSTarget


  # ============================================================
  # ORDER SNS TOPIC POLICY
  #
  # Allows EventBridge to publish BOTH:
  # 1. OrderConfirmed
  # 2. OrderFailed
  #
  # to the same OrderConfirmationTopic.
  # ============================================================

  OrderConfirmationTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref OrderConfirmationTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid:
              AllowOrderConfirmedEventBridgePublish

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic

            Condition:

              ArnEquals:

                aws:SourceArn:
                  !GetAtt OrderConfirmedRule.Arn


          - Sid:
              AllowOrderFailedEventBridgePublish

            Effect:
              Allow

            Principal:
              Service:
                events.amazonaws.com

            Action:
              - sns:Publish

            Resource:
              !Ref OrderConfirmationTopic

            Condition:

              ArnEquals:

                aws:SourceArn:
                  !GetAtt OrderFailedRule.Arn


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ============================================================
  # LOW STOCK SNS TOPIC ARN
  # ============================================================

  LowStockTopicArn:

    Description:
      SNS topic ARN for CloudMart low-stock alerts

    Value:
      !Ref LowStockTopic

    Export:

      Name:
        !Sub CloudMart-${Environment}-LowStockTopicArn


  # ============================================================
  # INVENTORY EVENTBRIDGE RULE ARN
  # ============================================================

  InventoryChangeRuleArn:

    Description:
      EventBridge inventory change rule ARN

    Value:
      !GetAtt InventoryChangeRule.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-InventoryChangeRuleArn


  # ============================================================
  # ORDER CONFIRMATION SNS TOPIC ARN
  # ============================================================

  OrderConfirmationTopicArn:

    Description:
      SNS topic ARN for CloudMart order confirmation notifications

    Value:
      !Ref OrderConfirmationTopic

    Export:

      Name:
        !Sub CloudMart-${Environment}-OrderConfirmationTopicArn


  # ============================================================
  # ORDER CONFIRMED EVENTBRIDGE RULE ARN
  # ============================================================

  OrderConfirmedRuleArn:

    Description:
      EventBridge rule ARN for confirmed orders

    Value:
      !GetAtt OrderConfirmedRule.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-OrderConfirmedRuleArn


  # ============================================================
  # ORDER FAILED EVENTBRIDGE RULE ARN
  # ============================================================

  OrderFailedRuleArn:

    Description:
      EventBridge rule ARN for failed orders

    Value:
      !GetAtt OrderFailedRule.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-OrderFailedRuleArn

